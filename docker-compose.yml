version: '3.8'

services:
  techrepair-postgres:
    image: postgres:16-alpine
    container_name: techrepair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techrepair_db
      POSTGRES_USER: techrepair_user
      POSTGRES_PASSWORD: techrepair_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techrepair_user -d techrepair_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
